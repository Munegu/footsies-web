<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footsies Web</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #stage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #credits {
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.75);
        color: #ddd;
        font: 13px/1.4 monospace;
        text-align: center;
      }
      #credits[hidden] {
        display: none;
      }
      #credits a {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
    </div>
    <footer id="credits" hidden>
      Unofficial web port of FOOTSIES · original game © 2020
      <a href="https://github.com/hifight/Footsies" target="_blank" rel="noopener">HiFight</a>
      · port © 2026 Nicolas Villetelle · not affiliated with HiFight
      <br />
      Free software under
      <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener">GPL-3.0</a
      >, provided without any warranty ·
      <a href="https://github.com/Munegu/footsies-web" target="_blank" rel="noopener"
        >source code</a
      >
      ·
      <a href="mentions-legales.html">mentions légales</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
